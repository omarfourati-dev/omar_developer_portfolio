name: Deploy – omarfourati.de

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_DIR: /home/portfolio

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to deploy directory
        run: |
          mkdir -p $DEPLOY_DIR
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            $GITHUB_WORKSPACE/ $DEPLOY_DIR/

      - name: Ensure Docker network 'web' exists
        run: docker network create web 2>/dev/null || echo "Network 'web' already exists."

      - name: Stop old container
        run: docker rm -f portfolio 2>/dev/null || true

      - name: Build image
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose build --no-cache

      - name: Start service
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose up -d --remove-orphans

      - name: Wait for health
        run: |
          echo "Waiting for portfolio to become healthy..."
          for i in $(seq 1 12); do
            if docker inspect --format='{{.State.Health.Status}}' portfolio 2>/dev/null | grep -q "healthy"; then
              echo "Portfolio is healthy."
              exit 0
            fi
            echo "  Attempt $i/12 – waiting 10s..."
            sleep 10
          done
          echo "Portfolio did not become healthy in time."
          docker logs portfolio --tail=50
          exit 1

      - name: Show status
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose ps

      - name: Reload Caddy
        run: docker compose -f /opt/caddy/docker-compose.yml exec caddy caddy reload --config /etc/caddy/Caddyfile
